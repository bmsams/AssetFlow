# Docker Compose configuration for Swagger UI
# Run with: docker-compose up
# Access at: http://localhost:8080

version: '3.8'

services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: ams-swagger-ui
    ports:
      - "8080:8080"
    environment:
      - SWAGGER_JSON=/api/openapi.yaml
      - BASE_URL=/
      - DISPLAY_REQUEST_DURATION=true
      - FILTER=true
      - SHOW_EXTENSIONS=true
      - SHOW_COMMON_EXTENSIONS=true
      - DEFAULT_MODELS_EXPAND_DEPTH=2
      - DEFAULT_MODEL_EXPAND_DEPTH=2
      - DOC_EXPANSION=list
      - DEEP_LINKING=true
      - PERSIST_AUTHORIZATION=true
      - VALIDATOR_URL=null
    volumes:
      - ./:/api:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Alternative: Redoc for a different documentation style
  redoc:
    image: redocly/redoc:v2.1.3
    container_name: ams-redoc
    ports:
      - "8081:80"
    environment:
      - SPEC_URL=/api/openapi.yaml
    volumes:
      - ./:/usr/share/nginx/html/api:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
