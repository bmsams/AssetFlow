            $ref: '#/components/schemas/AssetStatus'
        - name: stockroomId
          in: query
          schema:
            type: string
            format: uuid
        - name: assignedTo
          in: query
          schema:
            type: string
            format: uuid
        - name: manufacturerId
          in: query
          schema:
            type: string
            format: uuid
        - name: modelId
