        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /hardware-assets/{assetId}:
    get:
      tags:
        - Hardware Assets
      summary: Get hardware asset by ID
      description: Retrieves a hardware asset with all HAM-specific attributes
      operationId: getHardwareAsset
      parameters:
        - $ref: '#/components/parameters/AssetIdParam'
      responses:
        '200':
          description: Hardware asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAssetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Hardware Assets
      summary: Update hardware asset
      description: Updates a hardware asset with HAM-specific attributes
      operationId: updateHardwareAsset
      parameters:
        - $ref: '#/components/parameters/AssetIdParam'
      requestBody:
        required: true
        content:
