          $ref: '#/components/schemas/InspectionResult'
        notes:
          type: string
          description: Inspection notes
        failureReason:
          type: string
          description: Reason for failure (required if result is FAILED)

    ReceivingRecordResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            receivingRecord:
              $ref: '#/components/schemas/ReceivingRecord'
            lines:
              type: array
              items:
                $ref: '#/components/schemas/ReceivingLine'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ScanAssetResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            asset:
              $ref: '#/components/schemas/ScannedAsset'
            receivingLine:
              $ref: '#/components/schemas/ReceivingLine'
            receivingRecord:
              $ref: '#/components/schemas/ReceivingRecord'
            isLineComplete:
              type: boolean
            isReceivingComplete:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    InspectionRecordResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            inspectionRecord:
              $ref: '#/components/schemas/InspectionRecord'
            receivingLine:
              $ref: '#/components/schemas/ReceivingLine'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    InspectionResultResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            inspectionRecord:
              $ref: '#/components/schemas/InspectionRecord'
            assetCreated:
              $ref: '#/components/schemas/ScannedAsset'
            routedToReturn:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'

