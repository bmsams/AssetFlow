                $ref: '#/components/schemas/DashboardSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /dashboard/lease-expirations:
    get:
      tags:
        - Reports
      summary: Upcoming lease expirations
      description: Returns list of assets with upcoming lease expirations
      operationId: getLeaseExpirations
      parameters:
        - name: days
          in: query
          description: Number of days ahead to look (default 180, max 365)
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 180
      responses:
        '200':
          description: List of lease expirations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseExpirationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /dashboard/compliance:
    get:
      tags:
        - Reports
      summary: Compliance indicators
      description: |
        Returns compliance status for licenses, warranties, maintenance plans,
        and audit completion.
      operationId: getComplianceIndicators
      responses:
        '200':
          description: Compliance indicator data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceIndicatorsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Receiving Operations (Requirement 13, 21)
  # ============================================================================
  /lifecycle/receiving/from-po:
    post:
      tags:
        - Receiving
      summary: Create receiving record from purchase order
      description: |
        Creates a new receiving record from an existing purchase order.
        The receiving record will contain lines matching the PO lines that are pending receipt.
      operationId: createReceivingFromPO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceivingFromPORequest'
      responses:
        '201':
          description: Receiving record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /lifecycle/receiving/{receivingId}:
    get:
      tags:
        - Receiving
      summary: Get receiving record by ID
      description: Retrieves a receiving record with all its lines and status
      operationId: getReceivingRecord
      parameters:
        - name: receivingId
          in: path
          required: true
          description: Receiving record unique identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receiving record details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /lifecycle/receiving/{receivingId}/scan:
    post:
      tags:
        - Receiving
      summary: Scan asset during receiving
      description: |
        Records a serial number or barcode scan during the receiving process.
        This creates an asset record and associates it with the receiving line.
      operationId: scanAssetDuringReceiving
      parameters:
        - name: receivingId
          in: path
          required: true
          description: Receiving record unique identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanAssetRequest'
      responses:
        '201':
          description: Asset scanned and recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /lifecycle/receiving/{receivingId}/complete:
    post:
      tags:
        - Receiving
      summary: Complete receiving record
      description: |
        Marks a receiving record as complete. This updates the purchase order status
        and finalizes inventory updates.
      operationId: completeReceiving
      parameters:
        - name: receivingId
          in: path
          required: true
          description: Receiving record unique identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteReceivingRequest'
      responses:
        '200':
          description: Receiving completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /lifecycle/receiving/{receivingId}/cancel:
    post:
      tags:
        - Receiving
      summary: Cancel receiving record
      description: |
        Cancels a receiving record. Only allowed if no assets have been received yet.
      operationId: cancelReceiving
      parameters:
        - name: receivingId
          in: path
          required: true
          description: Receiving record unique identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReceivingRequest'
      responses:
        '200':
          description: Receiving cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Inspection Operations (Requirement 13)
  # ============================================================================
  /lifecycle/inspection:
    post:
      tags:
        - Receiving
      summary: Mark item for inspection
      description: |
        Creates an inspection record for a received item.
        Items marked for inspection are held until inspection passes.
      operationId: markForInspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkForInspectionRequest'
      responses:
        '201':
          description: Inspection record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /lifecycle/inspection/{inspectionId}/result:
    post:
      tags:
        - Receiving
      summary: Record inspection result
      description: |
        Records the result of an inspection (PASSED or FAILED).
        If passed, the asset is created. If failed, it's routed to return workflow.
      operationId: recordInspectionResult
      parameters:
        - name: inspectionId
          in: path
          required: true
          description: Inspection record unique identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInspectionResultRequest'
      responses:
        '200':
          description: Inspection result recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'


# ==============================================================================
# Components
# ==============================================================================
components:
  # ============================================================================
  # Security Schemes
  # ============================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from AWS Cognito

    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key for usage plan tracking

  # ============================================================================
  # Parameters
  # ============================================================================
  parameters:
    AssetIdParam:
      name: assetId
      in: path
      required: true
      description: Asset unique identifier
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortParam:
      name: sort
      in: query
      description: Field to sort by
      schema:
        type: string
        default: createdAt

    SortDirectionParam:
      name: sortDirection
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    BuildingIdParam:
      name: buildingId
      in: path
      required: true
      description: Building unique identifier
      schema:
        type: string
        format: uuid

    FloorIdParam:
      name: floorId
      in: path
      required: true
      description: Floor unique identifier
      schema:
        type: string
        format: uuid

    RoomIdParam:
      name: roomId
      in: path
      required: true
      description: Room unique identifier
      schema:
        type: string
        format: uuid

    RackIdParam:
      name: rackId
      in: path
      required: true
      description: Rack unique identifier
      schema:
        type: string
        format: uuid

    StockroomIdParam:
      name: stockroomId
      in: path
      required: true
      description: Stockroom unique identifier
      schema:
        type: string
        format: uuid

    BinIdParam:
      name: binId
      in: path
      required: true
      description: Bin location unique identifier
      schema:
        type: string
        format: uuid

    DepartmentIdParam:
      name: departmentId
      in: path
      required: true
      description: Department unique identifier
      schema:
        type: string
        format: uuid

    CostCenterIdParam:
      name: costCenterId
      in: path
      required: true
      description: Cost center unique identifier
      schema:
        type: string
        format: uuid

    VendorIdParam:
      name: vendorId
      in: path
      required: true
      description: Vendor unique identifier
      schema:
        type: string
        format: uuid

    ManufacturerIdParam:
      name: manufacturerId
      in: path
      required: true
      description: Manufacturer unique identifier
      schema:
        type: string
        format: uuid

    ModelIdParam:
      name: modelId
      in: path
      required: true
      description: Model unique identifier
      schema:
        type: string
        format: uuid

    UserIdParam:
      name: userId
      in: path
      required: true
      description: User unique identifier
      schema:
        type: string
        format: uuid

    POIdParam:
      name: poId
      in: path
      required: true
      description: Purchase order unique identifier
      schema:
        type: string
        format: uuid

    LineIdParam:
      name: lineId
      in: path
      required: true
      description: PO line item unique identifier
      schema:
        type: string
        format: uuid

    RequisitionIdParam:
      name: requisitionId
      in: path
      required: true
      description: Requisition unique identifier
      schema:
        type: string
        format: uuid

  # ============================================================================
  # Responses
  # ============================================================================
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid request parameters
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'

    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Insufficient permissions for this operation
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'

    Conflict:
      description: Conflict - resource state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: Resource state conflict
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'

    ValidationError:
      description: Validation error - invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: displayName
                  message: Display name is required
                  code: REQUIRED
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please retry after 60 seconds.
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
              requestId: req-123456
              timestamp: '2025-01-15T10:30:00Z'

  # ============================================================================
  # Schemas
  # ============================================================================
  schemas:
    # --------------------------------------------------------------------------
    # Common Types
    # --------------------------------------------------------------------------
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
            - timestamp
          properties:
            code:
              type: string
              description: Error code
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
                - BAD_REQUEST
                - INVALID_STATE_TRANSITION
            message:
              type: string
              description: Human-readable error message
            details:
              type: array
              description: Validation error details
              items:
                $ref: '#/components/schemas/ValidationError'
            requestId:
              type: string
              description: Unique request identifier for tracing
            timestamp:
              type: string
              format: date-time
              description: Error timestamp

    ValidationError:
      type: object
      required:
        - field
        - message
        - code
      properties:
        field:
          type: string
          description: Field that failed validation
        message:
          type: string
          description: Validation error message
        code:
          type: string
          description: Validation error code

    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - hasMore
      properties:
        total:
          type: integer
          description: Total number of items
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        hasMore:
          type: boolean
          description: Whether more pages exist
        nextCursor:
          type: string
          description: Cursor for next page (for cursor-based pagination)

    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
          description: Unique request identifier
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    # --------------------------------------------------------------------------
    # Enums
    # --------------------------------------------------------------------------
    AssetType:
      type: string
      enum: [HARDWARE, SOFTWARE, ENTERPRISE]
      description: Asset type classification

    AssetStatus:
      type: string
      enum:
        - ORDERED
        - RECEIVED
        - IN_STOCK
        - RESERVED
        - DEPLOYED
        - IN_MAINTENANCE
        - RETIRED
        - DISPOSED
      description: Asset lifecycle status

    AssetRelationType:
      type: string
      enum:
        - PARENT_CHILD
        - DEPENDENCY
        - CONNECTED_TO
        - INSTALLED_ON
        - RUNS_ON
        - LOCATION
        - COMPONENT
      description: CMDB relationship type

    AssetCondition:
      type: string
      enum: [EXCELLENT, GOOD, FAIR, POOR, DAMAGED]
      description: Physical asset condition

    DepreciationMethod:
      type: string
      enum: [STRAIGHT_LINE, DECLINING_BALANCE, UNITS_OF_PRODUCTION]
      description: Depreciation calculation method

    LicenseMetricType:
      type: string
      enum:
        - PER_USER
        - PER_DEVICE
        - PER_CORE
        - PER_PROCESSOR
        - SUBSCRIPTION
        - SITE
        - ENTERPRISE
        - CONCURRENT
      description: License metric type

    CompliancePosition:
      type: string
      enum: [COMPLIANT, OVER_LICENSED, UNDER_LICENSED]
      description: Software compliance position

    ReclamationStatus:
      type: string
      enum:
        - IDENTIFIED
        - PENDING_NOTIFICATION
        - USER_NOTIFIED
        - PENDING_APPROVAL
        - APPROVED
        - REJECTED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - DEFERRED
      description: Reclamation workflow status

    CriticalityLevel:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
      description: Asset criticality level

    WorkOrderStatus:
      type: string
      enum:
        - OPEN
        - ASSIGNED
        - IN_PROGRESS
        - ON_HOLD
        - COMPLETED
        - CANCELLED
      description: Work order status

    WorkOrderPriority:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
      description: Work order priority

    MaintenanceType:
      type: string
      enum: [PREVENTIVE, CORRECTIVE, PREDICTIVE, CONDITION_BASED]
      description: Maintenance type

    StockroomType:
      type: string
      enum: [STANDARD, LOANER, REPAIR, DISPOSAL, QUARANTINE]
      description: Stockroom type

    TransferOrderStatus:
      type: string
      enum:
        - DRAFT
        - PENDING_APPROVAL
        - APPROVED
        - IN_TRANSIT
        - RECEIVED
        - CANCELLED
      description: Transfer order status

    AuditType:
      type: string
      enum: [BLIND, SCHEDULED, SPOT_CHECK]
      description: Audit type

    AuditStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, CANCELLED]
      description: Audit status

    ScanMatchStatus:
      type: string
      enum: [MATCHED, NOT_FOUND, UNEXPECTED]
      description: Audit scan match status


    # --------------------------------------------------------------------------
    # Core Asset Schemas
    # --------------------------------------------------------------------------
    Asset:
      type: object
      required:
        - assetId
        - assetTag
        - assetType
        - displayName
        - status
        - createdAt
        - updatedAt
      properties:
        assetId:
          type: string
          format: uuid
          description: Unique asset identifier
        assetTag:
          type: string
          description: Human-readable asset tag (e.g., AMS-HW-20250115-ABC123)
          pattern: '^AMS-[A-Z]{2}-\d{8}-[A-Z0-9]{6}$'
        assetType:
          $ref: '#/components/schemas/AssetType'
        displayName:
          type: string
          description: Display name for the asset
          maxLength: 255
        description:
          type: string
          description: Asset description
        status:
          $ref: '#/components/schemas/AssetStatus'
        substatus:
          type: string
          description: Additional status detail
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid

    CreateAssetRequest:
      type: object
      required:
        - assetType
        - displayName
      properties:
        assetType:
          $ref: '#/components/schemas/AssetType'
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/AssetStatus'
          default: ORDERED
      example:
        assetType: HARDWARE
        displayName: Dell Latitude 5520 Laptop
        description: Employee laptop for engineering team
        status: ORDERED

    UpdateAssetRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        substatus:
          type: string
          maxLength: 50
      example:
        displayName: Dell Latitude 5520 Laptop - Updated
        description: Updated description for the laptop
        substatus: PENDING_REVIEW

    StateTransitionRequest:
      type: object
      required:
        - newState
      properties:
        newState:
          $ref: '#/components/schemas/AssetStatus'
        reason:
          type: string
          description: Reason for state transition
          maxLength: 500
      example:
        newState: DEPLOYED
        reason: Assigned to new employee John Smith

    AssetResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Asset'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    PaginatedAssetResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    # --------------------------------------------------------------------------
    # Asset Relationship Schemas
    # --------------------------------------------------------------------------
    AssetRelationship:
      type: object
      required:
        - relationshipId
        - sourceAssetId
        - targetAssetId
        - relationType
        - createdAt
      properties:
        relationshipId:
          type: string
          format: uuid
        sourceAssetId:
          type: string
          format: uuid
        targetAssetId:
          type: string
          format: uuid
        relationType:
          $ref: '#/components/schemas/AssetRelationType'
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    CreateRelationshipRequest:
      type: object
      required:
        - targetAssetId
        - relationType
      properties:
        targetAssetId:
          type: string
          format: uuid
        relationType:
          $ref: '#/components/schemas/AssetRelationType'
        metadata:
          type: object
          additionalProperties: true

    RelationshipResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AssetRelationship'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    RelationshipListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              asset:
                $ref: '#/components/schemas/Asset'
              relationship:
                $ref: '#/components/schemas/AssetRelationship'
              direction:
                type: string
                enum: [source, target]
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    # --------------------------------------------------------------------------
    # Hardware Asset Schemas
    # --------------------------------------------------------------------------
    HardwareAsset:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          properties:
            serialNumber:
              type: string
              maxLength: 100
            manufacturerId:
              type: string
              format: uuid
            modelId:
